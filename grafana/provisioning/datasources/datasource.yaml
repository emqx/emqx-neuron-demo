apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    database: demo
    user: grafana_reader
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: demo
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
