name: erp-mes-plc-demo

x-plc-env: &plc-env
  ENTERPRISE: ${ENTERPRISE:-acme-mfg}
  SITE: ${SITE:-plant-1}
  AREA: machining
  LINE: ${LINE:-line-1}
  MQTT_HOST: emqx
  MQTT_PORT: "1883"

x-plc: &plc
  build:
    context: ./services/plc-sim
  restart: unless-stopped
  depends_on:
    emqx:
      condition: service_healthy
  networks:
    - demo

x-neuron: &neuron
  image: emqx/neuronex:4.0.0
  restart: unless-stopped
  environment:
    - LOG_CONSOLE=1
    - NEURONEX__SERVER__ADMIN__PASSWORD=${NEURON_ADMIN_PASSWORD:?Run make security-init}
    - NEURONEX__SERVER__VIEWER__USERNAME=viewer
    - NEURONEX__SERVER__VIEWER__PASSWORD=demo-viewer
  depends_on:
    emqx:
      condition: service_healthy
  networks:
    - demo

services:
  emqx:
    image: emqx/emqx:6.3.2
    container_name: emqx
    hostname: emqx
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:18083:18083"
    environment:
      # Stable single-node identity keeps broker state across container IP changes.
      EMQX_NODE_NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_ADMIN_PASSWORD:?Run make security-init}
    volumes:
      - ./emqx/base.hocon:/opt/emqx/etc/base.hocon:ro
      - ./.runtime/mqtt-users.csv:/opt/emqx/etc/demo-users.csv:ro
      - ./.runtime/acl.conf:/opt/emqx/etc/demo-acl.conf:ro
      - ./.runtime/ws-auth.hocon:/opt/emqx/etc/demo-ws-auth.hocon:ro
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - demo

  timescaledb:
    image: timescale/timescaledb:2.30.1-pg17
    container_name: timescaledb
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./timescale/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - demo

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run make security-init}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Run make security-init}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - timescaledb
    networks:
      - demo

  mes:
    build:
      context: ./services/mes-sim
    container_name: mes
    hostname: mes
    environment:
      ENTERPRISE: ${ENTERPRISE:-acme-mfg}
      SITE: ${SITE:-plant-1}
      AREA: machining
      LINE: ${LINE:-line-1}
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      PORT: "8090"
      MQTT_USERNAME: mes
      MQTT_PASSWORD: ${MQTT_MES_PASSWORD:?Run make security-init}
      DEMO_ADMIN_KEY: ${DEMO_ADMIN_KEY:?Run make security-init}
      MES_DB: /data/mes.sqlite
    volumes:
      - mes-data:/data
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - demo

  operator:
    build:
      context: ./services/operator
    container_name: operator
    hostname: operator
    environment:
      ENTERPRISE: ${ENTERPRISE:-acme-mfg}
      SITE: ${SITE:-plant-1}
      AREA: machining
      LINE: ${LINE:-line-1}
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      PORT: "8080"
      MQTT_USERNAME: operator
      MQTT_PASSWORD: ${MQTT_OPERATOR_PASSWORD:?Run make security-init}
      MQTT_JWT_PRIVATE_KEY_FILE: /run/secrets/mqtt-signing-key.pem
      DEMO_ADMIN_KEY: ${DEMO_ADMIN_KEY:?Run make security-init}
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:?Run make security-init}
      DEMO_COOKIE_SECURE: "0"
      VISITOR_DB: /data/visitors.sqlite
      CLAIM_SECONDS: ${CLAIM_SECONDS:-30}
      BATCH_SECONDS: ${BATCH_SECONDS:-90}
      DEVICE_QUEUE_SIZE: ${DEVICE_QUEUE_SIZE:-3}
      SHOWCASE_TITLE: ${SHOWCASE_TITLE:-From shop floor to cloud.}
      SHOWCASE_EVENT: ${SHOWCASE_EVENT:-Live manufacturing demonstration}
    volumes:
      - visitor-data:/data
      - ./.runtime/mqtt-signing-key.pem:/run/secrets/mqtt-signing-key.pem:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - demo

  plc-1:
    <<: *plc
    container_name: plc-1
    hostname: plc-1
    environment:
      <<: *plc-env
      PLC_ID: plc-1
      AXIS_ID: axis-01
  plc-2:
    <<: *plc
    container_name: plc-2
    hostname: plc-2
    environment:
      <<: *plc-env
      PLC_ID: plc-2
      AXIS_ID: axis-01

  # Facility-side BACnet/IP device. Demonstrates Neuron's brownfield reach:
  # neuron-3 polls this over BACnet/IP while neuron-1/2 do OPC UA on the
  # shop floor. No MES integration — pure utilities telemetry.
  hvac-1:
    build:
      context: ./services/hvac-sim
    container_name: hvac-1
    hostname: hvac-1
    restart: unless-stopped
    environment:
      HVAC_ID: hvac-1
      BACPYPES_DEVICE_NAME: hvac-1
      BACPYPES_DEVICE_INSTANCE: "3001"
      BACPYPES_DEVICE_ADDRESS: "172.30.0.50/24"
      # Set HVAC_DEBUG=1 to dump bacpypes3 APDU-level logs (diagnostics only).
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      demo:
        ipv4_address: 172.30.0.50

  neuron-1:
    <<: *neuron
    container_name: neuron-1
    hostname: neuron-1
    ports: ["127.0.0.1:8085:8085"]
    volumes:
      - neuron-1-v4-data:/opt/neuronex/data
  neuron-2:
    <<: *neuron
    container_name: neuron-2
    hostname: neuron-2
    ports: ["127.0.0.1:8086:8085"]
    volumes:
      - neuron-2-v4-data:/opt/neuronex/data
  neuron-3:
    <<: *neuron
    container_name: neuron-3
    hostname: neuron-3
    ports: ["127.0.0.1:8087:8085"]
    volumes:
      - neuron-3-v4-data:/opt/neuronex/data

networks:
  demo:
    driver: bridge
    # Static subnet so hvac-1 can be pinned to a known IP — Neuron's BACnet
    # driver requires a numeric IP (not a hostname) for the target device.
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  emqx-data:
  timescale-data:
  grafana-data:
  # Keep legacy neuron-*-data volumes intact: 4.0.0 has no automatic 3.x migration.
  neuron-1-v4-data:
  neuron-2-v4-data:
  neuron-3-v4-data:
  mes-data:
  visitor-data:
