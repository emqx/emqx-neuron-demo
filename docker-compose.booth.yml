# Apply after docker-compose.yml. Generate .env.booth with tools/booth_credentials.py.
# All original published ports bind to loopback; only Caddy is internet-facing.
services:
  operator:
    environment:
      SHOWCASE_HOME: "1"
      SHOWCASE_EVENT: ${SHOWCASE_EVENT:-Florence · Manufacturing Forum}
      MQTT_PROXY: "1"
      TRUST_PROXY: "1"
      PUBLIC_BASE_URL: https://${DEMO_DOMAIN:?Set DEMO_DOMAIN in .env.booth}
      DEMO_COOKIE_DOMAIN: ${DEMO_DOMAIN}
      DEMO_COOKIE_SECURE: "1"
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?Generate .env.booth with tools/booth_credentials.py}
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:?Generate .env.booth with tools/booth_credentials.py}
      MES_PUBLIC_URL: https://mes.${DEMO_DOMAIN}/
      GRAFANA_PUBLIC_URL: https://grafana.${DEMO_DOMAIN}/
      EMQX_PUBLIC_URL: https://emqx.${DEMO_DOMAIN}/
      NEURON_1_PUBLIC_URL: https://neuron-1.${DEMO_DOMAIN}/
      NEURON_2_PUBLIC_URL: https://neuron-2.${DEMO_DOMAIN}/
      NEURON_3_PUBLIC_URL: https://neuron-3.${DEMO_DOMAIN}/

  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DEMO_DOMAIN}/

  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-data:/data
      - gateway-config:/config
    depends_on:
      - operator
    networks:
      - demo

volumes:
  gateway-data:
  gateway-config:
