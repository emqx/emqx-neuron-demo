<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Operator console</title>
  <style>
    :root { --bg:#f3f5f7; --card:#ffffff; --line:#d8dde3; --muted:#5a6473;
            --fg:#1a2330; --accent:#2563eb; --hub:#4338ca; --good:#16a34a;
            --warn:#d97706; --bad:#dc2626; }
    * { box-sizing: border-box; }
    body { background:var(--bg); color:var(--fg); margin:0;
           font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    header { padding:14px 24px; border-bottom:1px solid var(--line);
             background:var(--card);
             display:flex; justify-content:space-between; align-items:center; }
    h1 { font-size:14px; letter-spacing:.18em; margin:0; font-weight:600; }
    .right { font-size:11px; color:var(--muted); letter-spacing:.1em; }
    .right a { color:var(--accent); text-decoration:none; margin-left:14px; }
    main { padding:18px 24px; max-width:1280px; margin:0 auto; }
    .grid { display:grid; gap:14px; grid-template-columns:1fr 1fr; }
    .grid .full { grid-column: 1 / -1; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:6px;
            padding:14px 18px; }
    .card h2 { font-size:11px; letter-spacing:.18em; text-transform:uppercase;
               color:var(--muted); margin:0 0 12px; font-weight:600; }
    label { display:block; font-size:11px; color:var(--muted); letter-spacing:.1em;
            text-transform:uppercase; margin:8px 0 4px; }
    select, input, button {
      font-family:inherit; font-size:13px; padding:8px 10px;
      border-radius:4px; border:1px solid var(--line);
      background:var(--card); color:var(--fg);
    }
    select:focus, input:focus { outline:none; border-color:var(--accent); }
    button.primary { background:var(--accent); color:#fff; border-color:transparent;
                     font-weight:600; cursor:pointer; }
    button.primary:hover { filter:brightness(1.05); }
    button.primary:disabled { opacity:.5; cursor:not-allowed; }
    .row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
    .row > div { flex:0 0 auto; }
    .row > div.grow { flex:1 1 auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; padding:8px 10px; color:var(--muted);
         font-weight:600; border-bottom:1px solid var(--line);
         font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
    td { padding:8px 10px; border-bottom:1px solid var(--line);
         font-family:ui-monospace,Menlo,monospace; font-size:12px; }
    tr:last-child td { border-bottom:none; }
    .pill { display:inline-block; padding:2px 8px; border-radius:10px;
            font-size:10px; letter-spacing:.08em; text-transform:uppercase;
            font-weight:600; }
    .running   { background:rgba(37,99,235,.12);  color:var(--accent); }
    .pending   { background:rgba(90,100,115,.12); color:var(--muted); }
    .completed { background:rgba(22,163,74,.12);  color:var(--good); }
    .failed    { background:rgba(220,38,38,.12);  color:var(--bad); }
    .idle      { background:rgba(90,100,115,.12); color:var(--muted); }
    .holding   { background:rgba(217,119,6,.14);  color:var(--warn); }
    .faulted   { background:rgba(220,38,38,.12);  color:var(--bad); }
    .offline   { background:rgba(217,119,6,.14);  color:var(--warn); }
    button.action {
      font-family:inherit; font-size:11px; padding:3px 8px;
      border-radius:3px; border:1px solid var(--line);
      background:var(--card); color:var(--fg); cursor:pointer; margin-right:4px;
    }
    button.action:hover { background:#eef1f5; }
    button.action.danger { color:var(--bad); border-color:rgba(220,38,38,.4); }
    button.action:disabled { opacity:.4; cursor:not-allowed; }
    .empty { color:var(--muted); padding:18px 0; text-align:center; }
    .toast { position:fixed; bottom:16px; right:16px; background:var(--fg);
             color:var(--card); border:1px solid var(--fg);
             padding:10px 14px; border-radius:4px;
             font-size:12px; opacity:0; transition:opacity .2s;
             box-shadow:0 4px 12px rgba(0,0,0,.15); }
    .toast.show { opacity:1; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/" style="color:inherit;text-decoration:none;">← OPERATOR CONSOLE</a></h1>
    <span class="right">
      <span id="site-label">—</span>
      <a href="http://localhost:8090/" target="_blank">MES →</a>
      <a href="http://localhost:3000/d/production-overview" target="_blank">Grafana →</a>
    </span>
  </header>
  <main>
    <div class="grid">
      <div class="card">
        <h2>ERP · Place order</h2>
        <div class="row">
          <div>
            <label for="recipe">Recipe</label>
            <select id="recipe"></select>
          </div>
          <div>
            <label for="qty">Quantity</label>
            <input id="qty" type="number" min="1" max="100" value="1" />
          </div>
          <div class="grow"></div>
          <div>
            <label>&nbsp;</label>
            <button id="place" class="primary">Place order</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>PLCs · fault injection</h2>
        <table id="plcs"><thead><tr>
          <th>PLC</th><th>State</th><th>Batch</th><th>Phase</th><th>Updated</th>
          <th>Actions</th>
        </tr></thead><tbody></tbody></table>
        <div id="plc-empty" class="empty" style="display:none;">No PLCs reporting</div>
      </div>

      <div class="card full">
        <h2>Recent orders</h2>
        <table id="orders"><thead><tr>
          <th>Order</th><th>State</th><th>Batch</th><th>Part</th><th>PLC</th><th>When</th>
        </tr></thead><tbody></tbody></table>
        <div id="ord-empty" class="empty" style="display:none;">No orders yet</div>
      </div>
    </div>
  </main>
  <div id="toast" class="toast"></div>

<script>
function fmt(s) {
  if (s == null || s === '') return '';
  // Accept either an ISO string or a millisecond epoch (number / numeric string).
  const n = (typeof s === 'number') ? s
          : (typeof s === 'string' && /^\d+$/.test(s)) ? parseInt(s, 10)
          : null;
  const d = (n != null) ? new Date(n) : new Date(s);
  return isNaN(d.getTime()) ? '' : d.toLocaleTimeString();
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'className') node.className = v;
    else if (k === 'onclick') node.addEventListener('click', v);
    else if (k === 'value') node.value = v;
    else node.setAttribute(k, v);
  }
  for (const c of (children || [])) {
    if (c == null || c === '') continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function pill(state) {
  const cls = state || 'pending';
  return el('span', {className: 'pill ' + cls}, [state || '—']);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

let MODEL = { recipes: [], orders: [], plcs: [], enterprise: '—', site: '—' };

async function load() {
  try {
    const r = await fetch('/api/state');
    MODEL = await r.json();
  } catch (e) { return; }

  document.getElementById('site-label').textContent =
    ((MODEL.enterprise || '—') + ' · ' + (MODEL.site || '—')).toUpperCase();

  const recipeSel = document.getElementById('recipe');
  if (recipeSel.children.length !== MODEL.recipes.length) {
    recipeSel.replaceChildren(
      ...MODEL.recipes.map(r => el('option', {value: r}, [r]))
    );
  }

  function actionBtn(label, plcId, action, disabled, danger) {
    const btn = el('button', {className: 'action' + (danger ? ' danger' : '')},
                   [label]);
    if (disabled) btn.setAttribute('disabled', '');
    else btn.addEventListener('click', () => fault(plcId, action));
    return btn;
  }
  const plcsTbody = document.querySelector('#plcs tbody');
  plcsTbody.replaceChildren(...MODEL.plcs.map(c => {
    const isFaulted = c.state === 'faulted';
    const isRunning = c.state === 'running';
    const phaseLabel = c.phase
      ? (c.phase + (c.reason ? ` (${c.reason})` : ''))
      : '—';
    return el('tr', null, [
      el('td', null, [c.plc_id || '—']),
      el('td', null, [pill(c.state)]),
      el('td', null, [c.batch_id || '—']),
      el('td', null, [phaseLabel]),
      el('td', null, [fmt(c.ts)]),
      el('td', null, [
        actionBtn('Inject fault', c.plc_id, 'inject', !isRunning, true),
        actionBtn('Clear',        c.plc_id, 'clear',  !isFaulted, false),
      ]),
    ]);
  }));
  document.getElementById('plc-empty').style.display =
    MODEL.plcs.length ? 'none' : 'block';

  const ordsTbody = document.querySelector('#orders tbody');
  ordsTbody.replaceChildren(...MODEL.orders.slice(0, 20).map(o => el('tr', null, [
    el('td', null, [o.order_id]),
    el('td', null, [pill(o.state)]),
    el('td', null, [o.batch_id || '—']),
    el('td', null, [o.part_serial || '—']),
    el('td', null, [o.plc_id || '—']),
    el('td', null, [fmt(o.ts)]),
  ])));
  document.getElementById('ord-empty').style.display =
    MODEL.orders.length ? 'none' : 'block';
}

async function placeOrder() {
  const btn = document.getElementById('place');
  const recipe = document.getElementById('recipe').value;
  const qty = parseInt(document.getElementById('qty').value, 10) || 1;
  btn.disabled = true;
  try {
    const r = await fetch('/api/place-order', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({recipe_id: recipe, qty}),
    });
    const j = await r.json();
    if (r.ok) toast('Placed ' + j.order_id);
    else toast('Error: ' + (j.error || 'unknown'));
  } catch (e) {
    toast('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    load();
  }
}

async function fault(plcId, action) {
  try {
    const r = await fetch('/api/fault', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({plc_id: plcId, action, type: 'over_temp'}),
    });
    const j = await r.json();
    if (r.ok) toast(`${action === 'inject' ? 'Injected' : 'Cleared'} on ${plcId}`);
    else toast('Error: ' + (j.error || 'unknown'));
  } catch (e) {
    toast('Error: ' + e.message);
  } finally {
    load();
  }
}

document.getElementById('place').addEventListener('click', placeOrder);
load();
setInterval(load, 1500);
</script>
</body>
</html>
