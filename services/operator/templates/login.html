<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Factory demo</title><style>body{margin:0;background:#f6f7fb;color:#202134;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center}main{background:white;border:1px solid #e1e4ed;border-radius:14px;padding:38px;width:min(360px,calc(100vw - 80px))}h1{font-size:26px;letter-spacing:-.7px}p{font-size:14px;line-height:1.6;color:#697085}label{display:block;font-size:14px;margin:26px 0 8px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:7px;font:inherit;border:1px solid #d7d9e7}button{margin-top:16px;background:#5e4eff;color:white;border:0;cursor:pointer}.error{color:#b83737}small{font-size:12px;color:#5e4eff;font-weight:650}</style></head><body><main><small>EMQX Enterprise + EMQX Neuron</small><h1>The factory demo</h1><p>Sign in to explore the interactive factory and product screens.</p><form method="post"><input type="hidden" name="next" value="{{ target }}"><label for="password">Demo password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<button type="submit">Sign in</button></form></main></body></html>
